<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>ColdStream Pickleball Club Tournmant</title>
  <meta name="theme-color" content="#2dd4bf">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CSPBC">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css?v=20260912-pwa">
  <script src="./firebase-config.js?v=20260912-pwa"></script>
</head>
<body>
  <main id="app" class="app-shell" data-mode="viewer">
    <section class="topbar">
      <div>
        <p class="eyebrow">Live pickleball standings</p>
        <h1 id="event-title">Pickleball Tournament</h1>
      </div>
      <div class="actions">
        <a class="button-link" href="./admin/">Admin</a>
        <button type="button" id="refresh-button">Refresh scores</button>
      </div>
    </section>

    <section class="status-panel">
      <span id="sync-status">Loading live scores...</span>
      <span id="updated-at"></span>
    </section>

    <section id="stage" class="schedule-stack" aria-live="polite"></section>
  </main>

  <script src="./viewer.js?v=20260912-pwa"></script>
  <script src="./pwa.js?v=20260912-pwa"></script>
</body>
</html>
